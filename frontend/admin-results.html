<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Results</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="brand-bar">
  <div class="brand"><span class="brand-mark"></span> Election Results</div>
  <div class="actions">
    <button id="back-btn">Back to Dashboard</button>
    <button id="logout-btn">Log Out</button>
  </div>
</div>
<div class="container wide">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
    <h1 style="font-size:19px; color:var(--blue-deep);">Live Results</h1>
    <span style="background:var(--blue-deep); color:#fff; font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px;">ADMIN VIEW</span>
  </div>
  <p class="subtitle">Full results with turnout and current leaders — auto-refreshes every few seconds.</p>
  <div class="stat-row" id="stat-row"></div>
  <div id="results-card"><p class="subtitle">Loading...</p></div>
</div>

<script src="js/api.js"></script>
<script src="js/admin-results.js"></script>
</body>
</html>
