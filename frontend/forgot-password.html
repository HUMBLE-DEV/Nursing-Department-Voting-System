<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
  <div class="login-wrap">
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="3" y="11" width="18" height="10" rx="2" stroke-linejoin="round"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="page-title">Reset Your Password</h1>
    <p class="subtitle center" id="subtitle">Enter your index number and registered email — we'll send you a reset code.</p>
  </div>

  <!-- STEP 1: request a reset code -->
  <div class="card" id="request-card">
    <label>Index Number</label>
    <input type="text" id="request-index" placeholder="e.g. UENR/CS/21/0045">
    <label>Registered Email</label>
    <input type="email" id="request-email" placeholder="you@example.com">
    <button id="request-btn">Send Reset Code</button>
    <div class="msg hidden" id="request-msg"></div>
    <div class="link-row"><a href="index.html">Back to Log In</a></div>
  </div>

  <!-- STEP 2: enter the code + new password -->
  <div class="card hidden" id="reset-card">
    <label>Reset Code</label>
    <input type="text" id="reset-otp" placeholder="123456" maxlength="6">
    <label>New Password</label>
    <input type="password" id="reset-password" placeholder="At least 6 characters">
    <button id="reset-btn">Reset Password</button>
    <div class="msg hidden" id="reset-msg"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
