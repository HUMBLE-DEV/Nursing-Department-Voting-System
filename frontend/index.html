<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Voting Portal</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
  <div class="login-wrap">
    <!-- LOGO SLOT — put your department/school crest at frontend/images/logo.png,
         then set --logo-image in css/styles.css to show it here automatically.
         Until then, a placeholder ballot-box icon is shown. -->
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 10l10-6 10 6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 12v4M9 14l3-2 3 2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="page-title">Department Voting Portal</h1>
    <p class="subtitle center" id="subtitle">Log in with your index number to vote.</p>
  </div>

  <!-- LOGIN FORM -->
  <div class="card" id="login-card">
    <label>Index Number</label>
    <input type="text" id="login-index" placeholder="e.g. UENR/CS/21/0045">
    <label>Password</label>
    <input type="password" id="login-password" placeholder="Your password">
    <button id="login-btn">Log In</button>
    <div class="msg hidden" id="login-msg"></div>
    <div class="link-row">No account? <a id="show-register">Register</a></div>
    <div class="link-row"><a href="forgot-password.html">Forgot password?</a></div>
  </div>

  <!-- OTP FORM (shown after password is confirmed) -->
  <div class="card hidden" id="otp-card">
    <label>Verification Code</label>
    <p class="subtitle" style="margin-bottom:8px;">We sent a 6-digit code to your email. Enter it below.</p>
    <input type="text" id="otp-code" placeholder="123456" maxlength="6">
    <button id="otp-btn">Verify & Continue</button>
    <div class="msg hidden" id="otp-msg"></div>
  </div>

  <!-- REGISTER FORM -->
  <div class="card hidden" id="register-card">
    <label>Level</label>
    <select id="reg-level">
      <option value="100">Level 100</option>
      <option value="200">Level 200</option>
      <option value="300" selected>Level 300</option>
      <option value="400">Level 400</option>
    </select>
    <label>Index Number</label>
    <input type="text" id="reg-index" placeholder="e.g. UENR/CS/21/0045">
    <label>Email</label>
    <input type="email" id="reg-email" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="reg-password" placeholder="Choose a password">
    <button id="register-btn">Register</button>
    <div class="msg hidden" id="register-msg"></div>
    <div class="link-row">Already registered? <a id="show-login">Log In</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
